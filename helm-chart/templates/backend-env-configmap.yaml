apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "simulator.fullname" . }}-backend-env
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "simulator.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  JWT_EXPIRE_HOURS: {{ .Values.backend.jwtExpireHours | quote }}
