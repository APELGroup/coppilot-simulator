apiVersion: v1
data:
  # In-cluster address (the "postgres" Service, not localhost/host-mapped
  # ports — those only made sense for the docker-compose/local-dev setup).
  DATABASE_URL: "postgresql+psycopg2://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:{{ .Values.postgres.service.port }}/{{ .Values.postgres.database }}"
  JWT_EXPIRE_HOURS: {{ .Values.backend.jwtExpireHours | quote }}
  JWT_SECRET_KEY: {{ .Values.backend.jwtSecretKey | quote }}
  SEED_USER_PASSWORD: {{ .Values.backend.seedUserPassword | quote }}
kind: ConfigMap
metadata:
  labels:
    io.kompose.service: backend-env
  name: backend-env
