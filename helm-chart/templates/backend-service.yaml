apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: backend
  name: backend
spec:
  type: NodePort
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      # The container always listens on 8000 (set by the backend image's own
      # CMD) regardless of the external Service port above.
      targetPort: 8000
      nodePort: {{ .Values.backend.service.nodePort }}
  selector:
    io.kompose.service: backend
