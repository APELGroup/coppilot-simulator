apiVersion: v1
kind: Service
metadata:
  name: {{ include "dtlab.fullname" . }}-backend
  labels:
    {{- include "dtlab.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: NodePort
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      # The container always listens on 8000 (set by the backend image's own
      # CMD) regardless of the external Service port above.
      targetPort: 8000
      nodePort: {{ .Values.backend.service.nodePort }}
  selector:
    {{- include "dtlab.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "backend") | nindent 4 }}
