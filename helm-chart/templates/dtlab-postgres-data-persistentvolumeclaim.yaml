apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dtlab.fullname" . }}-postgres-data
  labels:
    {{- include "dtlab.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size }}
