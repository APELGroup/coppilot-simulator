apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "simulator.fullname" . }}-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "simulator.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "simulator.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "backend") | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "simulator.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "backend") | nindent 8 }}
    spec:
      # Unlike Docker named volumes, a PVC does NOT auto-copy the image's
      # existing directory content on first mount — it just shadows
      # /app/Backend/data with an empty filesystem, hiding the seeded
      # networks.json/networks/plots baked into the image. Seed it once
      # here (idempotent: only copies if networks.json isn't present yet),
      # reading from the same image's un-mounted copy of that data.
      # NOTE: some volume plugins pre-populate the mount with a directory
      # such as lost+found, so an "is the directory empty" check would skip
      # seeding — key off a real data file instead.
      initContainers:
        - name: seed-data
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              if [ ! -f /mnt/data/networks.json ]; then
                echo "Seeding /mnt/data from image defaults..."
                cp -a /app/Backend/data/. /mnt/data/
              fi
          volumeMounts:
            - mountPath: /mnt/data
              name: simulator-backend-data
      containers:
        - envFrom:
            - configMapRef:
                name: {{ include "simulator.fullname" . }}-backend-env
            - secretRef:
                name: {{ include "simulator.fullname" . }}-secrets
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          name: backend
          ports:
            - containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probePath }}
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probePath }}
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /app/Backend/data
              name: simulator-backend-data
      restartPolicy: Always
      volumes:
        - name: simulator-backend-data
          persistentVolumeClaim:
            claimName: {{ include "simulator.fullname" . }}-backend-data
