apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: backend
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: backend
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: backend
    spec:
      # Unlike Docker named volumes, a PVC does NOT auto-copy the image's
      # existing directory content on first mount — it just shadows
      # /app/Backend/data with an empty filesystem, hiding the seeded
      # networks.json/networks/plots baked into the image. Seed it once
      # here (idempotent: only copies if the PVC is still empty), reading
      # from the same image's un-mounted copy of that data.
      initContainers:
        - name: seed-data
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          command:
            - sh
            - -c
            - |
              if [ -z "$(ls -A /mnt/data)" ]; then
                echo "Seeding /mnt/data from image defaults..."
                cp -a /app/Backend/data/. /mnt/data/
              fi
          volumeMounts:
            - mountPath: /mnt/data
              name: dtlab-backend-data
      containers:
        - envFrom:
            - configMapRef:
                name: backend-env
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          name: backend
          ports:
            - containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probePath }}
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probePath }}
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /app/Backend/data
              name: dtlab-backend-data
      restartPolicy: Always
      volumes:
        - name: dtlab-backend-data
          persistentVolumeClaim:
            claimName: dtlab-backend-data
