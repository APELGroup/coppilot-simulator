apiVersion: v1
kind: Service
metadata:
  name: {{ include "simulator.fullname" . }}-postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "simulator.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: 5432
  selector:
    {{- include "simulator.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "postgres") | nindent 4 }}
