apiVersion: v1
kind: Secret
metadata:
  name: {{ include "simulator.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "simulator.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  # In-cluster address (the postgres Service, not localhost/host-mapped ports
  # — those only made sense for the docker-compose/local-dev setup). Embeds
  # the password above, so it lives in the Secret rather than the ConfigMap.
  DATABASE_URL: "postgresql+psycopg2://{{ .Values.postgres.user | urlquery }}:{{ .Values.postgres.password | urlquery }}@{{ include "simulator.fullname" . }}-postgres:{{ .Values.postgres.service.port }}/{{ .Values.postgres.database }}"
  JWT_SECRET_KEY: {{ .Values.backend.jwtSecretKey | quote }}
  SEED_USER_PASSWORD: {{ .Values.backend.seedUserPassword | quote }}
