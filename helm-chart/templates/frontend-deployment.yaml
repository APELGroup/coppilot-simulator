apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "simulator.fullname" . }}-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "simulator.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "simulator.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "simulator.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "frontend") | nindent 8 }}
    spec:
      {{- include "simulator.imagePullSecrets" . | nindent 6 }}
      containers:
        - image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          name: frontend
          env:
            # The frontend derives the backend URL from whatever hostname
            # the browser used to reach it (see resolveApiBaseUrl() in
            # src/routes/__root.tsx) plus this port — no IP hardcoded
            # anywhere in the chart.
            - name: BACKEND_PORT
              value: {{ .Values.backend.service.nodePort | quote }}
          ports:
            - containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
      restartPolicy: Always
