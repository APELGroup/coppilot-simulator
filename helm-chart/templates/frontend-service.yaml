apiVersion: v1
kind: Service
metadata:
  name: {{ include "dtlab.fullname" . }}-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "dtlab.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      # The container always listens on 3000 (dist/server/index.mjs's default)
      # regardless of the external Service port above.
      targetPort: 3000
      nodePort: {{ .Values.frontend.service.nodePort }}
  selector:
    {{- include "dtlab.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "frontend") | nindent 4 }}
