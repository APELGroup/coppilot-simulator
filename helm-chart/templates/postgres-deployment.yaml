apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dtlab.fullname" . }}-postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "dtlab.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "dtlab.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "postgres") | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "dtlab.selectorLabels" (dict "Chart" .Chart "Release" .Release "component" "postgres") | nindent 8 }}
    spec:
      containers:
        - env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dtlab.fullname" . }}-secrets
                  key: POSTGRES_PASSWORD
          image: "{{ .Values.postgres.image }}"
          name: postgres
          ports:
            - containerPort: 5432
              protocol: TCP
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: dtlab-postgres-data
      restartPolicy: Always
      volumes:
        - name: dtlab-postgres-data
          persistentVolumeClaim:
            claimName: {{ include "dtlab.fullname" . }}-postgres-data
