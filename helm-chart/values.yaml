# Default values for the dtlab chart.

postgres:
  image: postgres:16
  user: simbench
  # NOTE: for a real deployment, don't leave credentials in plain values.yaml —
  # override with --set postgres.password=... or a separate (untracked)
  # values file.
  password: simbench
  database: simbench
  service:
    port: 5432
  persistence:
    size: 5Gi

backend:
  image:
    repository: 192.168.188.204:80/simulator/backend
    tag: "1.0"
  service:
    port: 8000
    # Fixed so it's predictable (valid NodePort range: 30000-32767) — the
    # browser reaches the backend directly at <any-node-ip>:nodePort.
    nodePort: 30800
  probePath: /docs
  # Signs JWT auth tokens — must be overridden for anything beyond local/dev use.
  jwtSecretKey: "f68ce273aa35b4b37e52cf35b4774dd01b4c8c88ccf6249028f33bf8b058928a"
  jwtExpireHours: 24
  seedUserPassword: "DtLab2025!"
  persistence:
    # Backs Backend/data (simulation results, generated plots). ReadWriteOnce,
    # so this only works safely with a single backend replica.
    size: 1Gi

frontend:
  image:
    repository: 192.168.188.204:80/simulator/frontend
    tag: "1.0"
  service:
    port: 3000
    # Fixed so it's predictable — the user points their browser at
    # <node-ip>:nodePort.
    nodePort: 30300
