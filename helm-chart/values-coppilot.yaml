# Values for deploying dtlab with images pulled from the COP-PILOT Harbor
# OCI registry instead of the default local registry in values.yaml.
#
# NOTE: this only changes where images are pulled from — this chart has no
# imagePullSecrets support in its templates. If
# harbor.cop-pilot.rid-intrasoft.eu/cluster3e-flexibility is a private
# project, the target namespace's default ServiceAccount (or a per-pod
# pull secret) must already be configured to authenticate to Harbor before
# installing with this file, or image pulls will fail with ImagePullBackOff.

# Namespace all chart resources are deployed into. Must already exist (or be
# created separately) — this chart has no Namespace resource of its own.
namespace: uop

postgres:
  image: postgres:16
  user: simbench
  # CHANGEME: must be overridden — via --set postgres.password=... or a
  # separate (untracked) values file — before installing this chart. It's
  # stored in a Secret (see templates/secrets.yaml), never a ConfigMap.
  password: "CHANGEME"
  database: simbench
  service:
    port: 5432
  persistence:
    size: 5Gi

backend:
  image:
    repository: harbor.cop-pilot.rid-intrasoft.eu/cluster3e-flexibility/backend
    tag: "1.0"
    # The documented release workflow re-pushes the same tag on every
    # rebuild, so the default IfNotPresent would let nodes keep a stale
    # cached image indefinitely.
    pullPolicy: Always
  service:
    port: 8000
    # Fixed so it's predictable (valid NodePort range: 30000-32767) — the
    # browser reaches the backend directly at <any-node-ip>:nodePort.
    nodePort: 30800
  probePath: /docs
  # CHANGEME: signs JWT auth tokens — must be overridden for anything beyond
  # local/dev use. Stored in a Secret (see templates/secrets.yaml).
  jwtSecretKey: "CHANGEME"
  jwtExpireHours: 24
  # CHANGEME: password assigned to the seeded demo users on first startup.
  seedUserPassword: "CHANGEME"
  persistence:
    # Backs Backend/data (simulation results, generated plots). ReadWriteOnce,
    # so this only works safely with a single backend replica.
    size: 1Gi

frontend:
  image:
    repository: harbor.cop-pilot.rid-intrasoft.eu/cluster3e-flexibility/frontend
    tag: "1.0"
    # See backend.image.pullPolicy's comment.
    pullPolicy: Always
  service:
    port: 3000
    # Fixed so it's predictable — the user points their browser at
    # <node-ip>:nodePort.
    nodePort: 30300
