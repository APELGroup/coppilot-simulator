name: Build and push images

on:
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - "Frontend/**"
      - "helm-chart/**"
  workflow_dispatch:

env:
  REGISTRY: harbor.cop-pilot.rid-intrasoft.eu
  PROJECT: cluster3e-flexibility

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'Backend/**'
            frontend:
              - 'Frontend/**'
            helm:
              - 'helm-chart/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT }}/simulator-backend:latest
            ${{ env.REGISTRY }}/${{ env.PROJECT }}/simulator-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: Frontend
          file: Frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT }}/simulator-frontend:latest
            ${{ env.REGISTRY }}/${{ env.PROJECT }}/simulator-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  helm:
    needs: changes
    if: needs.changes.outputs.helm == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check if chart version changed
        id: version
        run: |
          CURRENT=$(grep '^version:' helm-chart/Chart.yaml | awk '{print $2}')
          PREV_SHA="${{ github.event.before }}"
          if [ -z "$PREV_SHA" ] || [ "$PREV_SHA" = "0000000000000000000000000000000000000000" ]; then
            PREVIOUS=""
          else
            PREVIOUS=$(git show "$PREV_SHA:helm-chart/Chart.yaml" 2>/dev/null | grep '^version:' | awk '{print $2}' || true)
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: azure/setup-helm@v4
        if: steps.version.outputs.changed == 'true'
        with:
          version: v3.15.4
      - name: Package and push chart
        if: steps.version.outputs.changed == 'true'
        run: |
          helm registry login ${{ env.REGISTRY }} -u ${{ secrets.HARBOR_USERNAME }} -p ${{ secrets.HARBOR_PASSWORD }}
          helm package helm-chart
          helm push simulator-${{ steps.version.outputs.current }}.tgz oci://${{ env.REGISTRY }}/${{ env.PROJECT }}
